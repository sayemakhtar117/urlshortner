apiVersion: apps/v1
kind: Deployment
metadata: { name: url-shortener }
spec:
  replicas: 3
  selector: { matchLabels: { app: url-shortener } }
  template:
    metadata: { labels: { app: url-shortener } }
    spec:
      containers:
      - name: url-shortener
        image: your-dockerhub/url-shortener:latest
        ports: [{ containerPort: 8080 }]
        env:
        - name: SPRING_DATA_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: mongodb-uri
        - name: SPRING_REDIS_HOST
          value: redis.default.svc.cluster.local
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: jwt-secret
        - name: SPRING_SECURITY_USER_NAME
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: api-user
        - name: SPRING_SECURITY_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: api-password